                    item.enTitle.toLowerCase().includes(query) ||
                    item.unit.toLowerCase().includes(query) ||
                    item.badge.toLowerCase().includes(query)

                nav.innerHTML = `<div class="text-center py-8 text-xs text-slate-400">لا توجد نتائج مطابقة لبحثك</div>`;
                return;

                            }

                            return `
                                <button onclick="handleQuizAnswer('${lessonId}', ${qIdx}, ${optIdx})" class="w-full text-left px-4 py-3 rounded-xl border text-sm transition flex items-center justify-between gap-2 ${btnClass}">
                                    <span><strong class="uppercase mr-1.5 text-brand-600 dark:text-brand-400">${letters[optIdx]})</strong> ${opt}</span>
                                    ${iconHtml}
                                </button>
                            `;
                        }).join('')}
                    </div>

                    ${saved !== undefined ? `
                        <div class="mt-4 p-3.5 rounded-xl text-xs sm:text-sm leading-relaxed flex items-start gap-2.5 ${
                            saved.isCorrect
                                ? 'bg-emerald-100/70 dark:bg-emerald-950/50 text-emerald-900 dark:text-emerald-200'
                                : 'bg-rose-100/70 dark:bg-rose-950/50 text-rose-900 dark:text-rose-200'
                        }">
                            <i data-lucide="${saved.isCorrect ? 'sparkles' : 'help-circle'}" class="w-4 h-4 shrink-0 mt-0.5"></i>
                            <div>
                                <strong>${saved.isCorrect ? 'إجابة صحيحة! أحسنت:' : 'توضيح الإجابة الصحيحة:'}</strong>
                                <span>${q.exp}</span>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderEssayCard(lessonId, eIdx, essay) {
            const uid = `${lessonId}-e${eIdx}`;
            const draftValue = state.essayDrafts[uid] || '';
            const isRevealed = !!state.revealedEssays[uid];

            return `
                <div id="essay-card-${uid}" class="p-5 sm:p-6 rounded-2xl bg-slate-50 dark:bg-slate-800/40 border ${essay.isJRE ? 'border-amber-400/70 dark:border-amber-600/50' : 'border-slate-200 dark:border-slate-800'}">
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <div class="flex items-center gap-2">
                            <span class="w-7 h-7 rounded-lg bg-emerald-600 text-white font-extrabold text-xs flex items-center justify-center shrink-0">${eIdx + 1}</span>
                            <span class="text-xs font-extrabold text-slate-500 dark:text-slate-400">سؤال مقالي تطبيقي</span>
                        </div>
                        ${essay.isJRE ? `
                            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-extrabold bg-gradient-to-r from-amber-500 to-orange-500 text-white shadow-sm en">
                                <i data-lucide="briefcase" class="w-3.5 h-3.5"></i>
                                JRE Question
                            </span>
                        ` : ''}
                    </div>

                    <p class="en-block text-sm sm:text-base font-semibold text-slate-900 dark:text-white leading-relaxed whitespace-pre-line mb-3">${essay.question}</p>

                    <div class="p-3 rounded-xl bg-indigo-50/80 dark:bg-indigo-950/40 border border-indigo-100 dark:border-indigo-900/50 text-xs sm:text-sm text-indigo-900 dark:text-indigo-200 mb-4 flex items-start gap-2">
                        <i data-lucide="compass" class="w-4 h-4 text-indigo-600 dark:text-indigo-400 shrink-0 mt-0.5"></i>
                        <span><strong>توجيه الحل: </strong>${essay.guidance}</span>
                    </div>

                    <div class="mb-3">
                        <label for="textarea-${uid}" class="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5">اكتب إجابتك باللغة الإنجليزية هنا (تُحفظ تلقائياً):</label>
                        <textarea
                            id="textarea-${uid}"
                            rows="4"
                            oninput="saveEssayDraft('${uid}', this.value)"
                            placeholder="Write your English response here before checking the model answer..."
                            class="en-block w-full rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 p-3.5 text-sm text-slate-800 dark:text-slate-100 focus:outline-none transition"
                        >${draftValue}</textarea>
                    </div>

                    <div class="flex flex-wrap items-center justify-between gap-3">
                        <button
                            onclick="toggleEssayModelAnswer('${lessonId}', ${eIdx})"
                            class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-extrabold transition shadow-sm ${
                                isRevealed
                                    ? 'bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-100'
                                    : 'bg-emerald-600 hover:bg-emerald-700 text-white'
                            }"
                        >
                            <i data-lucide="${isRevealed ? 'eye-off' : 'check-circle-2'}" class="w-4 h-4"></i>
                            <span>${isRevealed ? 'إخفاء الإجابة النموذجية' : 'عرض الإجابة النموذجية ومقارنة إجابتك'}</span>
                        </button>
                    </div>

                    ${isRevealed ? `
                        <div class="mt-4 p-4 sm:p-5 rounded-2xl bg-emerald-50/90 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/60 space-y-3 animate-fade-in">
                            <div>
                                <div class="text-xs font-extrabold text-emerald-800 dark:text-emerald-300 mb-1.5 flex items-center gap-1.5">
                                    <i data-lucide="award" class="w-4 h-4"></i>
                                    الإجابة النموذجية المقترحة (Model Answer):
                                </div>
                                <div class="en-block p-3.5 rounded-xl bg-white dark:bg-slate-900 border border-emerald-100 dark:border-emerald-900/50 text-sm text-slate-800 dark:text-slate-100 leading-relaxed whitespace-pre-line">
                                    ${essay.modelAnswer}
                                </div>
                            </div>
                            <div>
                                <div class="text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1.5">معايير التقييم الذاتي (Rubric Checklist):</div>
                                <ul class="space-y-1 text-xs text-slate-600 dark:text-slate-300">
                                    ${essay.rubric.map(r => `
                                        <li class="flex items-start gap-2">
                                            <i data-lucide="check" class="w-3.5 h-3.5 text-emerald-600 shrink-0 mt-0.5"></i>
                                            <span>${r}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function toggleEssayModelAnswer(lessonId, eIdx) {
            const lesson = CURRICULUM.find(l => l.id === lessonId);
            if (!lesson || !lesson.essays[eIdx]) return;
            const uid = `${lessonId}-e${eIdx}`;
            state.revealedEssays[uid] = !state.revealedEssays[uid];

            const cardEl = document.getElementById(`essay-card-${uid}`);
            if (cardEl) {
                cardEl.outerHTML = renderEssayCard(lessonId, eIdx, lesson.essays[eIdx]);
                lucide.createIcons();
            }
        }

        function handleQuizAnswer(lessonId, qIdx, selectedIdx) {
            const lesson = CURRICULUM.find(l => l.id === lessonId);
            if (!lesson || !lesson.quizzes[qIdx]) return;
            const q = lesson.quizzes[qIdx];
            const uid = `${lessonId}-q${qIdx}`;
            const isCorrect = selectedIdx === q.answer;

            state.answeredQuestions[uid] = {
                selected: selectedIdx,
                isCorrect
            };
            saveProgress();
            renderSidebar();

            // Re-render only that specific card for smooth UX
            const cardEl = document.getElementById(`card-${uid}`);
            if (cardEl) {
                cardEl.outerHTML = renderQuizCard(lessonId, qIdx, q);
                lucide.createIcons();
            }

            if (isCorrect) {
                showToast('إجابة ممتازة! تم تسجيل تقدمك.', 'success');
            }
        }

        // ============================================================================
        // 5. MASTER EXAM VIEW (20 Questions across all 4 Units)
        // ============================================================================
        function renderMasterExamView() {
            const examQuestions = ALL_QUESTIONS.slice(0, 20);
            const letters = ['a', 'b', 'c', 'd'];
            let score = 0;
            if (state.examSubmitted) {
                examQuestions.forEach((q, i) => {
                    if (state.examAnswers[i] === q.answer) score++;
                });
            }

            return `
                <div class="space-y-6 animate-fade-in">
                    <div class="bg-gradient-to-l from-indigo-600 to-brand-700 text-white rounded-3xl p-6 sm:p-8 shadow-lg">
                        <div class="flex flex-wrap items-center justify-between gap-4">
                            <div>
                                <span class="px-3 py-1 rounded-full bg-white/15 text-xs font-bold">التقييم النهائي الشامل</span>
                                <h2 class="text-2xl sm:text-3xl font-extrabold mt-2">اختبار الوحدات الأربع (20 سؤالاً)</h2>
                                <p class="text-indigo-100 text-sm mt-1">اختر الإجابة الصحيحة لكل سؤال ثم اضغط على "تصحيح الاختبار" لعرض نتيجتك التفصيلية.</p>
                            </div>
                            ${state.examSubmitted ? `
                                <div class="bg-white text-slate-900 px-6 py-4 rounded-2xl text-center shadow-md">
                                    <div class="text-xs font-bold text-slate-500">النتيجة النهائية</div>
                                    <div class="text-3xl font-extrabold text-brand-600">${score} / ${examQuestions.length}</div>
                                    <div class="text-xs font-bold text-emerald-600 mt-0.5">${Math.round((score / examQuestions.length) * 100)}%</div>
                                </div>
                            ` : ''}
                        </div>
                    </div>

                    <div class="space-y-5">
                        ${examQuestions.map((q, idx) => {
                            const userChoice = state.examAnswers[idx];
                            return `
                                <div class="bg-white dark:bg-slate-900 p-5 sm:p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                                    <div class="flex items-center justify-between text-xs text-slate-400 mb-2">
                                        <span class="font-bold text-brand-600 dark:text-brand-400">${q.lessonTitle}</span>
                                        <span class="en">${q.badge}</span>
                                    </div>
                                    <div class="flex items-start gap-3 mb-4">
                                        <span class="w-7 h-7 rounded-lg bg-brand-50 dark:bg-brand-950 text-brand-700 dark:text-brand-300 font-extrabold text-xs flex items-center justify-center shrink-0 mt-0.5">${idx + 1}</span>
                                        <p class="en-block text-base font-semibold text-slate-900 dark:text-white flex-1">${q.q}</p>
                                    </div>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 en-block">
                                        ${q.options.map((opt, optIdx) => {
                                            let cls = 'bg-slate-50 dark:bg-slate-800/60 border-slate-200 dark:border-slate-700 hover:border-brand-500';
                                            if (!state.examSubmitted && userChoice === optIdx) {
                                                cls = 'bg-brand-50 dark:bg-brand-950/70 border-brand-600 text-brand-900 dark:text-brand-200 font-bold ring-2 ring-brand-500/20';
                                            } else if (state.examSubmitted) {
                                                if (optIdx === q.answer) {
                                                    cls = 'bg-emerald-50 dark:bg-emerald-950/60 border-emerald-500 text-emerald-900 dark:text-emerald-200 font-bold';
                                                } else if (userChoice === optIdx && userChoice !== q.answer) {
                                                    cls = 'bg-rose-50 dark:bg-rose-950/60 border-rose-500 text-rose-900 dark:text-rose-200';
                                                } else {
                                                    cls = 'opacity-50 border-slate-200 dark:border-slate-800';
                                                }
                                            }
                                            return `
                                                <button ${state.examSubmitted ? 'disabled' : ''} onclick="selectExamOption(${idx}, ${optIdx})" class="w-full text-left px-4 py-3 rounded-xl border text-sm transition ${cls}">
                                                    <strong class="uppercase mr-1.5 text-brand-600 dark:text-brand-400">${letters[optIdx]})</strong> ${opt}
                                                </button>
                                            `;
                                        }).join('')}
                                    </div>
                                    ${state.examSubmitted ? `
                                        <div class="mt-3 p-3 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs sm:text-sm text-slate-700 dark:text-slate-300">
                                            <strong>التفسير: </strong>${q.exp}
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <div class="flex flex-wrap items-center justify-center gap-4 pt-4 pb-10">
                        ${!state.examSubmitted ? `
                            <button onclick="submitMasterExam(${examQuestions.length})" class="px-8 py-3.5 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white font-extrabold text-base shadow-lg shadow-brand-600/25 transition flex items-center gap-2">
                                <i data-lucide="check-square" class="w-5 h-5"></i>
                                <span>تصحيح الاختبار وعرض النتيجة</span>
                            </button>
                        ` : `
                            <button onclick="resetMasterExam()" class="px-8 py-3.5 rounded-2xl bg-slate-800 hover:bg-slate-900 dark:bg-slate-700 text-white font-extrabold text-base shadow-lg transition flex items-center gap-2">
                                <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                                <span>إعادة المحاولة من جديد</span>
                            </button>
                        `}
                    </div>
                </div>
            `;
        }

        function selectExamOption(qIdx, optIdx) {
            if (state.examSubmitted) return;
            state.examAnswers[qIdx] = optIdx;
            renderMainContent();
        }

        function submitMasterExam(total) {
            const answeredCount = Object.keys(state.examAnswers).length;
            if (answeredCount < total) {
                showToast(`يرجى الإجابة على جميع الأسئلة أولاً (${answeredCount} من ${total})`, 'error');
                return;
            }
            state.examSubmitted = true;
            renderMainContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            showToast('تم تصحيح الاختبار بنجاح!', 'success');
        }

        function resetMasterExam() {
            state.examAnswers = {};
            state.examSubmitted = false;
            renderMainContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================================================
        // 6. MOBILE SIDEBAR, THEME & EVENT LISTENERS
        // ============================================================================
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('sidebar-backdrop');

        function openMobileSidebar() {
            sidebar.classList.remove('translate-x-full');
            backdrop.classList.remove('hidden');
        }

        function closeMobileSidebar() {
            sidebar.classList.add('translate-x-full');
            backdrop.classList.add('hidden');
        }

        document.getElementById('mobile-menu-btn').addEventListener('click', openMobileSidebar);
        document.getElementById('close-sidebar-btn').addEventListener('click', closeMobileSidebar);
        backdrop.addEventListener('click', closeMobileSidebar);

        // Search Filter
        document.getElementById('sidebar-search').addEventListener('input', (e) => {
            state.searchQuery = e.target.value;
            renderSidebar();
        });

        // Theme Toggle
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.toggle('dark');
            localStorage.setItem('eng_app_theme', isDark ? 'dark' : 'light');
        }

        if (localStorage.getItem('eng_app_theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }

        document.getElementById('theme-toggle-desktop').addEventListener('click', toggleTheme);
        document.getElementById('theme-toggle-mobile').addEventListener('click', toggleTheme);

        // Reset Progress
        document.getElementById('reset-progress-btn').addEventListener('click', () => {
            state.answeredQuestions = {};
            state.essayDrafts = {};
            state.revealedEssays = {};
            localStorage.removeItem('eng_app_essays');
            saveProgress();
            renderSidebar();
            renderMainContent();
            showToast('تم إعادة ضبط سجل التقدم بنجاح', 'info');
        });

        // Initial Boot
        window.addEventListener('DOMContentLoaded', () => {
            updateProgressUI();
            renderSidebar();
            renderMainContent();
        });
    </script>
</body>
</html>
